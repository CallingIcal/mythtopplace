# Cache mikro 3 detik untuk menu publik: ribuan klik serentak hanya memicu 1 permintaan ke backend per 3 detik.
proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=menu:5m max_size=20m inactive=30s use_temp_path=off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  # IP asli pengunjung bila ada proxy HTTPS (Caddy) di depan container ini
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/security-headers.inc;

  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/api/games {
    include /etc/nginx/security-headers.inc;
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie "";
    proxy_cache menu;
    proxy_cache_methods GET;
    proxy_cache_valid 200 3s;
    proxy_cache_lock on;
    proxy_cache_use_stale updating error timeout;
    add_header X-Cache $upstream_cache_status;
  }

  location /assets/ {
    include /etc/nginx/security-headers.inc;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /sw.js {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-cache";
  }

  location / {
    include /etc/nginx/security-headers.inc;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
