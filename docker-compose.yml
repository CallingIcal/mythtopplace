services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?connection_limit=20&pool_timeout=30
      JWT_SECRET: ${JWT_SECRET}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_PASSWORD_SYNC: ${ADMIN_PASSWORD_SYNC:-false}
      ADMIN_EXCLUSIVE: ${ADMIN_EXCLUSIVE:-true}
      ADMIN_FEE: ${ADMIN_FEE:-1500}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PENDING_TTL_MINUTES: ${PENDING_TTL_MINUTES:-10}
      IDLE_MINUTES: ${IDLE_MINUTES:-40}
      MAX_ACTIVE_ORDERS: ${MAX_ACTIVE_ORDERS:-3}
      DB_WRITE_CONCURRENCY: ${DB_WRITE_CONCURRENCY:-8}
      MAX_INFLIGHT: ${MAX_INFLIGHT:-400}
      SEED_PRICE_MULTIPLIER: ${SEED_PRICE_MULTIPLIER:-1}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-5}
      PAY_MANDIRI_NAME: ${PAY_MANDIRI_NAME:-}
      PAY_MANDIRI_NUMBER: ${PAY_MANDIRI_NUMBER:-}
      PAY_DANA_NAME: ${PAY_DANA_NAME:-}
      PAY_DANA_NUMBER: ${PAY_DANA_NUMBER:-}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-80}:8080"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
